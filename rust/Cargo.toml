[package]
name = "rust_lib_scan_downloader"
version = "0.1.1"
edition = "2021"

[workspace]
members = ["server"]
resolver = "2"

[lib]
crate-type = ["cdylib", "staticlib"]

# Disable wasm-pack's `wasm-opt` step for the release profile. The FRB
# `build-web` pipeline builds with `-C target-feature=+atomics,+bulk-memory`
# (RUSTFLAGS); wasm-opt (binaryen) cannot process that atomics-featured wasm
# and fails — `os error 32` on Windows, a binaryen error on Linux — which
# surfaces as `dart run flutter_rust_bridge build-web` exiting 255 in CI and
# Docker. Disabling it only skips the size optimization; the module is fully
# functional and the sync FRB bridge is unaffected.
# NOTE: this key must live under `profile.release` — wasm-pack 0.15.0 only
# reads `wasm-opt` at the profile level, not directly under
# `package.metadata.wasm-pack` (that placement is reported as an unknown key).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = []
encryption = ["deopti_transfer/encryption", "dep:getrandom"]

[dependencies]
deopti_transfer = { version = "0.1.2", features = ["std"] }
flutter_rust_bridge = "=2.12.0"
getrandom = { version = "0.4", default-features = false, optional = true }
qrcodegen = "1.8.0"
rustbinary = { version = "0.1.4" }
rxing = { version = "0.9.2", default-features = false, features = [
    "qrcode",
    "decoders",
    "encoding_rs",
] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Only used to synthesize QR test scenes; the runtime encoder is qrcodegen.
qrcode = "0.14.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
