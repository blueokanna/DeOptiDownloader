name: scan_downloader
description: "DeOptiDownloader - fountain-coded QR file transfer over light (Rust core + Flutter)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Referenced by transitive packages' IconData (kept so CupertinoIcons glyphs
  # resolve; tree-shaking keeps the shipped font tiny).
  cupertino_icons: ^1.0.8
  flutter_rust_bridge: 2.12.0
  rust_lib_scan_downloader:
    path: rust_builder

  # Material 3 typography via Google Fonts (Noto Sans SC bundled in assets,
  # so it works offline on every platform, including Web).
  google_fonts: ^8.2.1

  # Camera capture (mobile + macOS + Windows via camera_windows; web via camera_web).
  camera: ^0.12.0
  camera_windows: ^0.2.6

  # File pick / save / share.
  # share_plus must stay < 13.1.0: file_picker (the only stable line, ^11.x)
  # pins win32 to ^5.9.0, while share_plus >= 13.1.0 requires win32 ^6.0.1, so
  # a higher range makes `pub get` fail version solving. 12.0.2 is the newest
  # compatible release.
  file_picker: ^11.0.0
  share_plus: ^12.0.0
  path_provider: ^2.1.0

  # Keep the screen on while streaming / receiving.
  # <1.6.0 keeps win32 on ^5.x, compatible with file_picker.
  wakelock_plus: '>=1.4.0 <1.6.0'

  # MIME detection + web interop (getUserMedia, canvas capture, download).
  mime: ^2.0.0
  web: ^1.1.1

  # Persistent user settings (theme, wallpaper, language, judge key).
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Google Fonts (Noto Sans SC) is bundled as a variable font so typography
  # works offline on every platform (including Web and China networks that
  # block fonts.gstatic.com). The same file is also named under the
  # google_fonts asset convention (Regular/Medium/Bold) — the build tooling
  # deduplicates identical content, so the app ships a single ~17 MB font.
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 700

  # Assets.
  assets:
    - assets/fonts/
    - assets/images/

  # Official Flutter i18n (ARB → gen-l10n); see l10n.yaml at the project root.
  generate: true
