# DeOptiDownloader — nginx serving the Flutter Web build.
#
# The Rust WASM module built by flutter_rust_bridge may use threads backed by
# SharedArrayBuffer, so the page is served with COOP/COEP isolation. The
# current synchronous bridge works even without it (e.g. GitHub Pages), but
# the headers are kept so a future threaded build keeps working and so
# SharedArrayBuffer is available for the highest-throughput path.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-Origin isolation required by the shared-memory WASM module.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Cache the immutable hashed Flutter assets hard.
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm application/json image/svg+xml;
    gzip_min_length 1024;
}
