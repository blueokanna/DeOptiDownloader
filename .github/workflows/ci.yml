# Continuous integration: Rust, Flutter, Web/WASM and Docker.
#
# Every command below is the exact one used by developers locally (see
# scripts/build-web.ps1 and the Dockerfile), so a green run is meaningful.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the exact Flutter/Dart toolchain the project is developed against.
  FLUTTER_VERSION: '3.44.6'
  # wasm-bindgen-cli must match the wasm-bindgen crate in rust/Cargo.lock.
  WASM_BINDGEN_VERSION: '0.2.92'

jobs:
  # ---------------------------------------------------------------------------
  # Rust core + server: format, lint, unit tests (whole workspace).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all --manifest-path rust/Cargo.toml --check

      # Default-feature pass covers the workspace (lib + server).
      - name: Clippy (default features, deny warnings)
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      # The native app builds enable the `encryption` feature via
      # rust/cargokit.yaml, so the gated code (JRC, crypto) must lint too.
      - name: Clippy (encryption feature, deny warnings)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --features encryption --locked -- -D warnings

      - name: Run unit tests (workspace, default features)
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

      # Covers the JRC round trip (jrc_keygen_pack_recover) and the
      # encryption-gated container paths that the default build skips.
      - name: Run unit tests (encryption feature)
        run: cargo test --manifest-path rust/Cargo.toml --lib --features encryption --locked

  # ---------------------------------------------------------------------------
  # Flutter: static analysis + host tests (loads the native Rust library).
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter (analyze · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      # Host tests call RustLib.init(), which dlopens the release library from
      # rust/target/release/ — build it first. The `encryption` feature is
      # enabled because native app builds enable it via rust/cargokit.yaml,
      # and the JRC tests (jrcSelfTest) require it.
      - name: Build native Rust library (release, encryption)
        run: cargo build --release --features encryption --locked --manifest-path rust/Cargo.toml

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ---------------------------------------------------------------------------
  # Web/WASM: Rust → wasm32-unknown-unknown → Flutter web bundle.
  # ---------------------------------------------------------------------------
  web:
    name: Web (WASM bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # FRB build-web compiles with -Z build-std (nightly + rust-src).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install wasm-pack and matching wasm-bindgen-cli (prebuilt)
        run: |
          curl -sSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo cp /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/
          curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/${{ env.WASM_BINDGEN_VERSION }}/wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo cp /tmp/wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/
          wasm-pack --version
          wasm-bindgen --version

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Build Rust WASM module (flutter_rust_bridge build-web)
        run: dart run flutter_rust_bridge build-web --release --dart-root ${{ github.workspace }}

      - name: Build Flutter Web bundle
        run: flutter build web --release

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: build/web
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Docker: validate the containerized deployment actually builds.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deopti-downloader:ci .
